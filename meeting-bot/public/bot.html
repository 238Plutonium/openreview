<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECHO Zoom Bot</title>
    <link rel="icon" href="/echo-avatar.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b1c28;
        color: #f4f8fb;
        font-family:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }

      #app {
        display: grid;
        grid-template-rows: auto 1fr;
        width: 100%;
        height: 100%;
      }

      #status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(244, 248, 251, 0.14);
        background: linear-gradient(90deg, #0b3d5c, #1f7a8c);
        font-size: 13px;
        line-height: 1.4;
      }

      #brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #brand img {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
      }

      #brand strong {
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      #meetingSDKElement {
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="status">
        <div id="brand">
          <img src="/echo-avatar.svg" alt="ECHO AI Assistant" />
          <strong>ECHO AI Assistant</strong>
        </div>
        <span id="statusText">Starting...</span>
      </div>
      <div id="meetingSDKElement"></div>
    </main>
    <script src="/bot.js"></script>
  </body>
</html>
